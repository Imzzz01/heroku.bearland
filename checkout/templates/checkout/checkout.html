{% extends 'store/base.html' %}

{% block content %}

<h1>Checkout</h1>
<div class="checkout-container">
    <div class="order-summary">
        <h3>Order Summary</h3>
         {% for item in cart.items.all %}
         <div class="order-item">
            <p>{{ item.product.name }} x {{ item.quantity }}</p>
            <p>£{{ item.subtotal }}</p>

        </div>
        {% endfor %}
        <div class="order-total">
            <p>Total: £{{ cart.total }}</p>
            </div>

</div>

<div class="payment-form">
    <form id="payment-form">
          {% csrf_token %}
          <div id="card-element"></div>
          <button id="submit-button" class="btn btn-primary">Pay Now</button>
    </form>
    </div>
    </div>
<script src="https://js.stripe.com/v3/"></script>

<script>
    const stripe = Stripe('{{ STRIPE_PUBLISHABLE_KEY }}');
    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    const form = document.getElementById('payment-form');
    const submitButton = document.getElementById('submit-button');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitButton.disabled = true;

        // Create payment intent confirmation
        const {error, paymentIntent} = await stripe.confirmCardPayment(
            '{{ client_secret }}', {
                payment_method: {
                    card: cardElement,
                }
            }
        );

        if (error) {
            // Show error to your customer
            console.error(error);
            submitButton.disabled = false;
            alert('Payment failed: ' + error.message);
        } else if (paymentIntent.status === 'succeeded') {
            // Redirect to success page with payment intent ID
            window.location.href = "{% url 'payment_success' %}?payment_intent=" + paymentIntent.id;
        }
    });
</script>
