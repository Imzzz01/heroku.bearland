<!--success.html-->{% extends "store/base.html" %}

{% block content %}
<!--  Payment success page content -->
<div class="order-success">
   <!-- Success message -->
    <h2>Payment Successful!</h2>
    <p>Thank you for your order! Your payment has been processed successfully.</p>
   <!--  Order details -->
    <p>Order ID: {{ order.id }}</p>
    <p>Amount Paid: £{{ order.amount }}</p>
    <!--  Nav buttons -->
    <a href="{% url 'store:home' %}" class="btn btn-primary">Return to Home</a>
   </div>
{% endblock %}
