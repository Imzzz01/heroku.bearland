{% extends 'store/base.html' %}
{% load static %}

{% block title %}Bear Land - Shopping Cart{% endblock %}

{% block content %}

<!-- Main content for the shopping cart -->
<section class="container mt-5"> 
    <h1 class="text-center">Your Cart</h1>
    
    <div class="row mt-5">
        <div class="col-md-8">
            <div id="cart-items" class="card p-3">
                <p class="text-center">Your cart is empty</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <h5>Order Summary</h5>
                <hr>
                <p>Subtotal: <span id="subtotal">£0.00</span></p>
                <p>Shipping: <span id="shipping">£0.00</span></p>
                <hr>
                <p><strong>Total: <span id="total">£0.00</span></strong></p>
                <button class="btn btn-primary w-100" onclick="checkout()">Checkout</button>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    // Function to display cart items and calculate totals
    function displayCart() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let cartItems = document.getElementById('cart-items');
        let subtotal = 0;
         //Clear previous cart items
        if (cart.length === 0) {
            cartItems.innerHTML = '<p class="text-center">Your cart is empty</p>';
        } else {
            cartItems.innerHTML = cart.map((item, index) => `
                <div class="cart-item mb-3 border-bottom pb-3">
                    <div class="row">
                        <div class="col-md-8">
                            <h6>${item.name}</h6>
                            <p class="text-muted">Price: £${parseFloat(item.price).toFixed(2)}</p>
                        </div>
                        <div class="col-md-4 text-end">
                            <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">
                                <i class="fa fa-trash"></i> Remove
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            subtotal = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
        }
        
        // Update subtotal, shipping, and total
        const shipping = subtotal > 0 ? 5.00 : 0.00;
        const total = subtotal + shipping;
        
        document.getElementById('subtotal').textContent = `£${subtotal.toFixed(2)}`;
        document.getElementById('shipping').textContent = `£${shipping.toFixed(2)}`;
        document.getElementById('total').textContent = `£${total.toFixed(2)}`;
    }
    
    function removeFromCart(index) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
        
        Swal.fire({
            title: 'Removed!',
            text: 'Item removed from cart',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
        });
    }
    
    function checkout() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        if (cart.length === 0) {
            Swal.fire({
                title: 'Empty Cart!',
                text: 'Please add items to your cart before checkout',
                icon: 'warning',
                confirmButtonText: 'OK'
            });
            return;
        }
        
        Swal.fire({
            title: 'Thank you for your purchase!',
            text: 'Your order has been processed successfully',
            icon: 'success',
            confirmButtonText: 'OK'
        }).then(() => {
            localStorage.removeItem('cart');
            displayCart();
        });
    }
    
    // Display cart on page load
    document.addEventListener('DOMContentLoaded', function() {
        displayCart();
    });
</script>
{% endblock %}
